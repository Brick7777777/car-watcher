name: Car watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # try every 5 minutes
  workflow_dispatch:         # adds a "Run workflow" button
    inputs:
      test_message:
        description: "Only send a test message to Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: car-watcher

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Marktplaats for cars
        run: python3 watcher.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ inputs.test_message }}

      - name: Remember which ads were already seen
        if: ${{ !inputs.test_message }}
        run: |
          git config user.name "watcher-bot"
          git config user.email "watcher-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen ads" && git push)
